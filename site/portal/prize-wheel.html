<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Sweepstouch Prize Wheel Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Lilita+One&family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --night: #FFFFFF;
    --indigo: #1A1A1B;
    --violet: #3F3F3F;
    --neon: #FE82C0;
    --gold: #FC0680;
    --gold-deep: #FD44A0;
    --fire: #FC0680;
    --lime: #E6E7E8;
    --rose: #FD44A0;
    --text: #3F3F3F;
    --muted: #7A7A7A;
    --line: #E6E7E8;
    --disp: "Lilita One", "Arial Black", Impact, sans-serif;
    --ui: Montserrat, "Helvetica Neue", Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--text); font-family: var(--ui); overflow-x: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }

  .stage {
    position: relative; z-index: 1; min-height: 100%; box-sizing: border-box;
    padding-inline: 16px; padding-block: 18px 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    overflow-x: clip;
  }
  .brand { text-align: center; display: flex; flex-direction: column; gap: 2px; margin-bottom: clamp(6px, 2.4vh, 22px); }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: #FC0680; }
  h1 {
    margin: 0; font-family: var(--disp); font-weight: 400; font-size: clamp(36px, 5.4vw, 60px); line-height: 1; letter-spacing: .01em;
    color: #000000;
    text-wrap: balance;
  }

  .arena {
    --ws: clamp(280px, min(calc(100vh - 270px), calc(100vw - 140px)), 680px);
    --ws: clamp(280px, min(calc(100dvh - 270px), calc(100vw - 140px)), 680px);
    display: grid; justify-items: center; width: 100%;
  }
  .wheel-wrap { position: relative; width: var(--ws); aspect-ratio: 1; max-width: 100%; }
  .wheel-rays {
    position: absolute; left: 50%; top: 50%; width: 240%; height: 240%; transform: translate(-50%, -50%);
    background: repeating-conic-gradient(from 0deg, rgba(254,193,223,0) 0deg, rgba(252,6,128,.06) 6deg, rgba(254,193,223,0) 12deg, rgba(254,193,223,0) 18deg);
    -webkit-mask: radial-gradient(circle, #000 18%, rgba(0,0,0,.45) 32%, transparent 50%); mask: radial-gradient(circle, #000 18%, rgba(0,0,0,.45) 32%, transparent 50%);
    filter: blur(12px); opacity: .75; pointer-events: none;
    animation: rays 48s linear infinite;
  }
  #wheel { position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; pointer-events: none; display: block; }
  .hub-btn {
    position: absolute; left: 50%; top: 50%; width: 21.2%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: transparent; border: 0; padding: 0; cursor: pointer; z-index: 2;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hub-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 5px; }
  .hub-btn:disabled { cursor: default; }

  .spin-btn {
    position: relative; z-index: 3; margin-top: calc(var(--ws, 300px) * .02);
    font-family: var(--disp); font-size: clamp(22px, 2.6vw, 30px); letter-spacing: .08em; color: #FFFFFF; cursor: pointer;
    background: linear-gradient(180deg, #FD44A0 0%, #FC0680 45%, #C80466 100%); border: 2px solid #FE82C0; border-radius: 999px;
    padding: 13px 68px; min-width: 220px;
    box-shadow: 0 6px 0 #8E0247, 0 10px 28px rgba(252,6,128,.4), inset 0 2px 0 rgba(255,255,255,.45);
    transition: transform .1s, box-shadow .1s, filter .2s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    animation: btnPulse 2.4s ease-in-out infinite;
  }
  @keyframes btnPulse { 50% { box-shadow: 0 6px 0 #8E0247, 0 10px 40px rgba(252,6,128,.65), inset 0 2px 0 rgba(255,255,255,.45); } }
  .spin-btn:hover { filter: brightness(1.07); }
  .spin-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8E0247, 0 6px 18px rgba(252,6,128,.4); }
  .spin-btn:focus-visible { outline: 3px solid #3F3F3F; outline-offset: 4px; }
  .spin-btn:disabled { cursor: default; filter: saturate(.7) brightness(.95); animation: none; transform: none; }
  .hint { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-align: center; min-height: 1.3em; }
  .hint b { color: #FC0680; }

  /* Botones superiores */
  .top-actions { position: fixed; z-index: 15; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; box-sizing: border-box;
    font-family: var(--ui); font-weight: 700; font-size: 13px; letter-spacing: .05em;
    color: var(--text); background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 15px; cursor: pointer; backdrop-filter: blur(6px); touch-action: manipulation;
  }
  .icon-btn:hover { border-color: var(--neon); }
  .icon-btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .icon-btn svg { width: 16px; height: 16px; flex: none; }
  .icon-btn.round { width: 40px; padding: 0; justify-content: center; }

  /* Editor */
  .editor {
    position: fixed; z-index: 16; top: 0; right: 0; bottom: 0; width: min(430px, 100%); box-sizing: border-box;
    background: #FFFFFF; border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(63,63,63,.15);
  }
  .editor header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px 14px; border-bottom: 1px solid var(--line); }
  .editor h2 { margin: 0; font-size: 17px; font-weight: 800; }
  .editor .body { overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
  .editor fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .editor legend { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--neon); padding: 0; margin-bottom: 8px; }
  .editor label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
  .editor input[type=text], .editor input[type=number], .editor select {
    font-family: var(--ui); font-size: 14px; font-weight: 600; color: var(--text);
    background: #F7F7F7; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; box-sizing: border-box; min-width: 0;
  }
  .editor input:focus, .editor select:focus { outline: 2px solid var(--neon); outline-offset: 0; border-color: transparent; }
  .seg-row { display: grid; grid-template-columns: 24px 1.1fr 1fr .7fr; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #F7F7F7; }
  .seg-row .num { font-size: 13px; font-weight: 800; color: var(--muted); align-self: center; text-align: center; }
  .seg-row .actions { grid-column: 2 / 5; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .odds { font-variant-numeric: tabular-nums; }
  .btn { font-family: var(--ui); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 1px solid var(--line); background: transparent; color: var(--text); touch-action: manipulation; }
  .btn:hover { border-color: var(--neon); }
  .btn:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .note { font-size: 12px; line-height: 1.5; color: var(--muted); margin: 0; }

  /* Ganaste */
  .win {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding-inline: 16px; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, rgba(255,230,242,.92), rgba(255,255,255,.95) 70%);
    animation: fade .3s ease-out;
  }
  @keyframes fade { from { opacity: 0; } }
  .rays {
    position: absolute; left: 50%; top: 45%; width: 170vmax; height: 170vmax; transform: translate(-50%, -50%);
    background: repeating-conic-gradient(from 0deg, rgba(254,193,223,0) 0deg, rgba(252,6,128,.07) 6deg, rgba(254,193,223,0) 12deg, rgba(254,193,223,0) 18deg);
    -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 18%, transparent 38%); mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 18%, transparent 38%);
    filter: blur(14px); opacity: .8;
    animation: rays 22s linear infinite; pointer-events: none;
  }
  @keyframes rays { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .win-card { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: pop .65s cubic-bezier(.2,1.5,.35,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .win-eyebrow { font-size: 13px; font-weight: 900; letter-spacing: .3em; text-transform: uppercase; color: #FC0680; }
  .win-title {
    font-family: var(--disp); font-size: clamp(58px, 13vw, 124px); line-height: .95;
    background: linear-gradient(180deg, #FD44A0 0%, #FC0680 55%, #B8045E 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 0 #FEC1DF) drop-shadow(0 10px 28px rgba(252,6,128,.3));
  }
  .win-amount { font-family: var(--disp); font-size: clamp(50px, 12vw, 100px); line-height: 1; color: #3F3F3F; text-shadow: 0 5px 0 #E6E7E8, 0 0 26px rgba(252,6,128,.2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  /* Billete 3D del premio */
  .bill3d {
    position: relative; width: min(400px, 80vw); aspect-ratio: 508 / 301; perspective: 950px; margin-block: 4px 22px; 
    animation: couponIn .8s cubic-bezier(.2,1.5,.35,1) .15s both;
  }
  @keyframes couponIn { from { transform: scale(.3) rotate(-18deg); opacity: 0; } }
  .bill-shadow { position: absolute; left: 14%; right: 14%; bottom: -16%; height: 20%; background: rgba(63,63,63,.55); border-radius: 50%; filter: blur(16px); animation: billShadow 6s ease-in-out infinite; }
  .bill-float { position: absolute; inset: 0; transform-style: preserve-3d; animation: billFloat 6s ease-in-out infinite; }
  .bill-spin { position: absolute; inset: 0; transform-style: preserve-3d; animation: billSpin 6s ease-in-out infinite; }
  .bill-layer, .bill-front, .bill-back {
    position: absolute; inset: 0; background-image: var(--art); background-size: contain; background-position: center; background-repeat: no-repeat;
    backface-visibility: hidden;
  }
  .bill-layer { filter: brightness(.52) sepia(.5) saturate(2) hue-rotate(290deg); }
  .bill-front { transform: translateZ(2px); filter: drop-shadow(2px 3px 0 #850B47); }
  .bill-back { transform: rotateY(180deg) translateZ(11px); filter: brightness(.66); }
  @keyframes billSpin { 0%, 50%, 100% { transform: rotateX(-3deg) rotateY(0deg); } 25% { transform: rotateX(-5deg) rotateY(17deg); } 75% { transform: rotateX(-5deg) rotateY(-17deg); } }
  @keyframes billFloat { 0%, 50%, 100% { transform: translateY(0); } 25% { transform: translateY(-7px); } 75% { transform: translateY(7px); } }
  @keyframes billShadow { 0%, 50%, 100% { transform: scale(.9); opacity: .65; } 25%, 75% { transform: scale(.84); opacity: .5; } }
  .win-unit { font-weight: 900; letter-spacing: .24em; font-size: 15px; color: #FC0680; }
  .win p { max-width: 32ch; color: #3F3F3F; margin: 6px 0 0; font-weight: 600; line-height: 1.45; }
  .win button {
    margin-top: 14px; font-family: var(--disp); font-size: 22px; letter-spacing: .04em; color: #FFFFFF; cursor: pointer;
    background: linear-gradient(180deg, #FD44A0 0%, #FC0680 45%, #C80466 100%); border: 2px solid #FE82C0; border-radius: 999px; padding: 14px 44px;
    box-shadow: 0 6px 0 #8E0247, 0 0 30px rgba(252,6,128,.6), inset 0 2px 0 rgba(255,255,255,.45); touch-action: manipulation;
  }
  .win button:active { transform: translateY(4px); box-shadow: 0 2px 0 #8E0247, 0 0 20px rgba(252,6,128,.5); }
  .win button:focus-visible { outline: 3px solid #3F3F3F; outline-offset: 4px; }

  /* ---------- Regalo de puntos (animación de la caja) ---------- */
  .gs-wrap { --k: .7; position: relative; width: calc(400px * var(--k)); height: calc(540px * var(--k)); margin-block: -14px 0; font-family: "Baloo 2", var(--disp); }
  .gs-wrap .gs-scene { position: absolute; left: 0; top: 0; transform: scale(var(--k)); transform-origin: 0 0; }
  @media (max-height: 760px), (max-width: 420px) { .gs-wrap { --k: .6; } }
  /* ---------- ESCENA ---------- */
  .gs-scene {
    position: relative;
    width: 400px;
    height: 540px;
  }
  
  
  .gs-rays {
    position: absolute;
    left: 50%; top: 200px;
    width: 640px; height: 640px;
    margin: -320px 0 0 -320px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(252,6,128,.12) 0 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%);
            mask: radial-gradient(circle, #000 20%, transparent 68%);
    opacity: 0;
    filter: blur(4px);
    animation: gs-spin 20s linear infinite;
    pointer-events: none;
  }
  .gs-glow-burst {
    position: absolute;
    left: 50%; top: 320px;
    width: 360px; height: 360px;
    margin: -180px 0 0 -180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(254,130,192,.55), rgba(252,6,128,.12) 40%, transparent 70%);
    opacity: 0;
    transform: scale(.2);
    pointer-events: none;
  }
  
  .gs-floor-shadow {
    position: absolute;
    left: 50%; top: 440px;
    width: 320px; height: 54px;
    margin-left: -160px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(63,63,63,.3), transparent 70%);
    opacity: 0;
    transform: scale(0);
  }
  
  .gs-stage {
    position: absolute;
    left: 100px; top: 320px;
    width: 200px; height: 130px;
    opacity: 0;
    transform-origin: 50% 100%;
  }
  
  
  .gs-confetti { position: absolute; inset: 0; pointer-events: none; }
  .gs-confetti i {
    position: absolute;
    left: 200px; top: 180px;
    display: block;
    border-radius: 2px;
  }
  
  /* ---------- CAJA 3D ---------- */
  .gs-gift-box-container {
    width: 200px;
    height: 200px;
    transform: scale(1.3);
    transform-origin: 50% 130px;
    perspective: 1000px;
    perspective-origin: 50% 20%;
  }
  .gs-gift-wobble {
    width: 200px; height: 200px;
    transform-style: preserve-3d;
    transform-origin: 100px 130px;
  }
  
  .gs-gift-box {
    --gift-box-color: #FFE6F2;
    --gift-box-edge-color: #B8045E;
    --wrap-color: #FC0680;
    --wrap-ribbon-color: #FC0680;
    --wrap-top-color: #FC0680;
  
    width: 200px;
    height: 200px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(35deg);
  }
  
  .gs-gift-box .gs-gift-box__side,
  .gs-gift-box .gs-gift-box__end {
    position: absolute;
    width: 200px; height: 200px;
    border: 2px solid var(--gift-box-edge-color);
  }
  .gs-gift-box .gs-gift-box__side { height: 130px; }   /* caja más baja */
  .gs-gift-box .gs-gift-box-lid__side {
    position: absolute;
    width: 206px; height: 50px;
    border: 2px solid var(--gift-box-edge-color);
  }
  .gs-gift-box .gs-gift-box-lid__end {
    position: absolute;
    width: 206px; height: 206px;
    border: 2px solid var(--gift-box-edge-color);
  }
  .gs-gift-box .gs-gift-box__side,
  .gs-gift-box .gs-gift-box-lid__side {
    background: linear-gradient(to right,
      var(--gift-box-color) 40%, var(--wrap-color) 40%,
      var(--wrap-color) 60%, var(--gift-box-color) 60%);
  }
  .gs-gift-box .gs-gift-box__end,
  .gs-gift-box .gs-gift-box-lid__end {
    background:
      linear-gradient(to right, transparent 40%, var(--wrap-top-color) 40%, var(--wrap-top-color) 60%, transparent 60%),
      linear-gradient(to bottom, var(--gift-box-color) 40%, var(--wrap-color) 40%, var(--wrap-color) 60%, var(--gift-box-color) 60%);
  }
  
  .gs-gift-box .gs-gift-box__side--front  { transform: rotateY(0deg)   translateZ(100px); }
  .gs-gift-box .gs-gift-box__side--back   { transform: rotateY(180deg) translateZ(100px); }
  .gs-gift-box .gs-gift-box__side--left   { transform: rotateY(-90deg) translateZ(100px); }
  .gs-gift-box .gs-gift-box__side--right  { transform: rotateY(90deg)  translateZ(100px); }
  .gs-gift-box .gs-gift-box__side--top    { transform: rotateX(90deg)  translateZ(100px); }
  .gs-gift-box .gs-gift-box__side--bottom { transform: rotateX(-90deg) translateZ(30px); }
  
  /* Ancho/fondo de la caja: 1 = original, menor = más angosta */
  .gs-gift-body {
    position: absolute;
    left: 0; top: 0;
    width: 200px; height: 200px;
    transform-style: preserve-3d;
    transform: scale3d(.82, 1, .82);
  }
  
  /* Paredes interiores (se ven al abrir) */
  .gs-inner-wall {
    position: absolute;
    width: 200px; height: 130px;
    background:
      linear-gradient(to right, transparent 40%, var(--wrap-color) 40%, var(--wrap-color) 60%, transparent 60%),
      linear-gradient(to bottom, #FFF5FA, #FFE6F2);
  }
  .gs-inner-wall--front { transform: rotateY(0deg)   translateZ(98px); }
  .gs-inner-wall--back  { transform: rotateY(180deg) translateZ(98px); }
  .gs-inner-wall--left  { transform: rotateY(-90deg) translateZ(98px); }
  .gs-inner-wall--right { transform: rotateY(90deg)  translateZ(98px); }
  
  .gs-inner-glow {
    position: absolute;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,1), rgba(254,130,192,.6) 35%, transparent 70%);
    transform: rotateX(90deg) translateZ(-22px);
    opacity: 0;
  }
  
  /* ---------- TAPA (agrupada para abrirse junta) ---------- */
  .gs-gift-box-lid {
    position: absolute;
    left: 0; top: 0;
    width: 200px; height: 200px;
    transform-style: preserve-3d;
    /* bisagra: borde superior trasero de la tapa */
    transform-origin: 100px -10px -103px;
  }
  .gs-gift-box .gs-gift-box-lid__side--front { transform: rotateY(0deg)   translateZ(103px) translateX(-3px) translateY(-10px); }
  .gs-gift-box .gs-gift-box-lid__side--back  { transform: rotateY(180deg) translateZ(103px) translateX(3px)  translateY(-10px); }
  .gs-gift-box .gs-gift-box-lid__side--left  { transform: rotateY(-90deg) translateZ(106px) translateY(-10px); }
  .gs-gift-box .gs-gift-box-lid__side--right { transform: rotateY(90deg)  translateZ(100px) translateY(-10px); }
  .gs-gift-box .gs-gift-box-lid__side--top   { transform: rotateX(90deg)  translateZ(113px) translateX(-3px) translateY(0); }
  /* Solid underside: remains visible when the lid opens towards the viewer. */
  .gs-gift-box .gs-gift-box-lid__side--bottom { transform: rotateX(-90deg) translateZ(-110px) translateX(-3px); }
  
  .gs-gift-box .gs-ribbon-l,
  .gs-gift-box .gs-ribbon-r {
    position: absolute;
    width: 70px; height: 70px;
    border: 2px solid var(--wrap-ribbon-color);
    border-radius: 50% 50% 0 50%;
    transform-style: preserve-3d;
    transform-origin: 50% 50%;
  }
  .gs-gift-box .gs-ribbon-l {
    transform: rotateX(75deg) rotateY(90deg)
               translateZ(calc(80px - var(--gift-box-position)))
               translateX(-85px) translateY(-75px) skewY(30deg);
  }
  .gs-gift-box .gs-ribbon-r {
    transform: rotateX(-5deg) rotateY(90deg)
               translateZ(calc(80px - var(--gift-box-position)))
               translateX(-30px) translateY(-110px) skewY(30deg);
  }
  .gs-ribbon-l-end,
  .gs-ribbon-r-end {
    position: absolute;
    width: 40px; height: 110px;
    background:
      linear-gradient(45deg, var(--wrap-top-color) 72%, transparent 72%),
      linear-gradient(-45deg, var(--wrap-top-color) 72%, transparent 72%);
    border: 2px solid var(--gift-box-edge-color);
    border-top: none; border-bottom: none;
  }
  .gs-ribbon-l-end { transform: rotateX(-70deg) translateX(80px) translateY(-80px) translateZ(-60px); }
  .gs-ribbon-r-end { transform: rotateX(80deg)  translateX(80px) translateY(-80px) translateZ(60px); }
  
  /* Moño: contenedor para centrarlo sobre el cruce del listón */
  .gs-bow {
    position: absolute;
    left: 0; top: 0;
    width: 200px; height: 200px;
    transform-style: preserve-3d;
    transform: translate3d(var(--bow-x, 3px), var(--bow-y, 7px), var(--bow-z, 22px));
  }
  
  /* ---------- +100 ---------- */
  .gs-reward {
    position: absolute;
    left: 35px; top: 0;
    width: 130px; height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* contra-rotación para que siempre mire a la cámara */
    transform: translate3d(0, 45px, 0) rotateY(-35deg) rotateX(22deg) scale(.4);
    opacity: 0;
  }
  .gs-reward__float {
    display: flex;
    flex-direction: column;
    align-items: center;

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = false;
  const STORE = "ruleta-sweepstouch-blanca-v4";
  const DISP = '"Lilita One", "Arial Black", Impact, sans-serif';
  const UIF = 'Montserrat, "Helvetica Neue", Arial, sans-serif';
  const TAU = Math.PI * 2;

  // ---------- Calidad automática ----------
  // 2 = completa, 1 = media, 0 = ligera. Arranca en media en equipos modestos y baja sola si el celular no alcanza ~40 cuadros por segundo.
  let Q = ((navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 3)) ? 1 : 2;
  const maxDpr = () => Q === 0 ? 1.5 : 2;
  const SPARK_MAX = [140, 320, 600], SPARK_RATE = [.35, .6, 1], BLUR_SAMPLES = [2, 4, 8];
  let perfN = 0, perfSum = 0;
  function trackPerf(dt) {
    if (document.hidden) { perfN = perfSum = 0; return; }
    perfN++; perfSum += dt;
    if (perfN >= 90) { const avg = perfSum / perfN; perfN = perfSum = 0; if (avg > 25 && Q > 0) { Q--; layoutAll(); } }
  }
  const clone = o => JSON.parse(JSON.stringify(o));

  const DEFAULT = {
    eyebrow: "Sweepstouch • Daily Prizes",
    title: "Spin & Win!",
    hub: "SPIN",
    palette: "marca",
    // PREMIOS DE LA RULETA (van en orden de las manecillas del reloj, empezando arriba).
    // Para agregar más campos, copia una línea y cambia sus datos. Para quitar, borra la línea.
    // type: "puntos" | "cupon" | "producto" | "nada" (espacio sin premio)   ·   weight: qué tan seguido sale (más alto = más seguido)
    segs: [
      { type: "puntos",   value: "50",        weight: 0 },
      { type: "cupon",    value: "$5",        weight: 0 },
      { type: "puntos",   value: "100",       weight: 0 },
      { type: "nada", value: "TRY AGAIN", weight: 10 },
      { type: "puntos", value: "25", weight: 5 },
      { type: "cupon",    value: "$10",       weight: 0 },
      { type: "puntos",   value: "200",       weight: 0 },
      { type: "puntos",   value: "75",        weight: 0 },
      { type: "nada", value: "TRY AGAIN", weight: 10 },
      { type: "producto", value: "FREE GIFT", weight: 0 }
    ]
  };
  let state = (() => {
    let s; try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
    const d = clone(DEFAULT);
    if (!s || !Array.isArray(s.segs) || s.segs.length !== d.segs.length) return d;
    return Object.assign(d, s, { segs: d.segs });
  })();
  // IMÁGENES DE PREMIO: si el premio que cae coincide con una clave, la pantalla de "You Won!" muestra esa imagen.
  // Clave = "tipo:VALOR" tal como aparece en la ruleta, por ejemplo "cupon:$10", "puntos:500" o "producto:REGALO".
  // INSIGNIAS DE PUNTOS: si el premio de puntos tiene insignia, la caja de regalo la muestra en vez del número.

  function segColors(n) {
    if (state.palette === "marca") {
      const B = [{ base: hex("#FC0680"), text: W, stroke: hex("#8E0247") }, { base: hex("#F7F7F7"), text: hex("#FC0680"), stroke: W }, { base: hex("#3F3F3F"), text: W, stroke: hex("#FC0680") }];

  }

  // ---------- Textos de la ruleta ----------
  function segMain(s) {
    const v = String(s.value || "").trim().toUpperCase();
    if (s.type === "producto") return v || "FREE GIFT";
    if (s.type === "nada") return v || "TRY AGAIN";
    if (s.type === "cupon") return v.startsWith("$") ? v : "$" + (v || "0");
    return v || "0";
  }
  const segSub = s => s.type === "puntos" ? "POINTS" : s.type === "cupon" ? "COUPON" : s.type === "nada" ? "" : "FREE";

  // ---------- Geometría ----------
  const wrap = $("wheelWrap"), wc = $("wheel"), wx = wc.getContext("2d");

  let rimImg = null, discImg = null, frontImg = null, glowImg = null;
  const NB = 24;

  function layoutWheel() {

    const ws = wrap.clientWidth; if (!ws) return;

  }

  // Aura de fuego con zonas más intensas; se hace girar y respirar en cada cuadro
  function buildGlow() {
    const S = Ro * 1.34, c = mk(S * 2 * dpr, S * 2 * dpr), x = c.getContext("2d");
    x.scale(dpr, dpr); x.translate(S, S);
    const g = x.createRadialGradient(0, 0, Ro * .9, 0, 0, Ro * 1.3);
    g.addColorStop(0, "rgba(252,6,128,0)"); g.addColorStop(.16, "rgba(253,68,160,.75)"); g.addColorStop(.42, "rgba(252,6,128,.3)"); g.addColorStop(1, "rgba(252,6,128,0)");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, Ro * 1.3, 0, TAU); x.fill();
    if (x.createConicGradient) {
      const cg = x.createConicGradient(0, 0, 0);
      [[0, .55], [.14, 1], [.3, .6], [.46, .95], [.62, .5], [.8, 1], [1, .55]].forEach(([p, a]) => cg.addColorStop(p, `rgba(0,0,0,${a})`));

  function buildRim() {
    const c = mk(C * dpr, C * dpr), x = c.getContext("2d");
    x.scale(dpr, dpr); x.translate(cx, cx);
    let g;
    x.save(); x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = Ro * .06; x.shadowOffsetY = Ro * .03;
    x.fillStyle = "#4A0126"; x.beginPath(); x.arc(0, 0, Ro, 0, TAU); x.fill(); x.restore();
    g = x.createLinearGradient(0, -Ro, 0, Ro);
    g.addColorStop(0, "#FE82C0"); g.addColorStop(.18, "#FD44A0"); g.addColorStop(.48, "#FC0680"); g.addColorStop(.76, "#8E0247"); g.addColorStop(1, "#D8046F");
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, Ro, 0, TAU); x.arc(0, 0, Rd, 0, TAU, true); x.fill();
    if (x.createConicGradient) {
      const cg = x.createConicGradient(-Math.PI / 2, 0, 0);
      [0, .12, .25, .37, .5, .62, .75, .87, 1].forEach((s, i) => cg.addColorStop(s, i % 2 ? "rgba(255,255,255,.28)" : "rgba(255,255,255,0)"));
      x.fillStyle = cg; x.beginPath(); x.arc(0, 0, Ro, 0, TAU); x.arc(0, 0, Rd, 0, TAU, true); x.fill();
    }
    x.lineWidth = Math.max(1.5, Ro * .006); x.strokeStyle = "rgba(255,230,242,.95)";
    x.beginPath(); x.arc(0, 0, Ro - x.lineWidth / 2, 0, TAU); x.stroke();
    x.strokeStyle = "rgba(70,0,35,.55)"; x.beginPath(); x.arc(0, 0, Ro * .968, 0, TAU); x.stroke();
    x.strokeStyle = goldGrad(x, Rd); x.lineWidth = Ro * .03;
    x.beginPath(); x.arc(0, 0, Rd + Ro * .012, 0, TAU); x.stroke();
    x.strokeStyle = "rgba(255,255,255,.7)"; x.lineWidth = 1;
    x.beginPath(); x.arc(0, 0, Rd + Ro * .026, 0, TAU); x.stroke();
    for (let i = 0; i < NB; i++) {
      const a = -Math.PI / 2 + i * TAU / NB, px = Math.cos(a) * Rb, py = Math.sin(a) * Rb;
      x.fillStyle = "rgba(40,0,20,.8)"; x.beginPath(); x.arc(px, py, Ro * .034, 0, TAU); x.fill();
      x.strokeStyle = "rgba(230,231,232,.65)"; x.lineWidth = 1; x.stroke();
    }
    rimImg = c;
  }

  function wedge(x, R, a0, a1) { x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a1); x.closePath(); }

  function buildDisc() {
    const segs = state.segs, n = segs.length, ARC = TAU / n, cols = segColors(n);
    const S = Math.ceil(2 * Rd * dpr), R = S / 2;
    const c = mk(S, S), x = c.getContext("2d");
    x.translate(R, R);
    segs.forEach((s, i) => {
      const a0 = -Math.PI / 2 + i * ARC - ARC / 2, a1 = a0 + ARC, b = cols[i].base;
      const g = x.createRadialGradient(0, 0, R * .16, 0, 0, R);
      g.addColorStop(0, rgb(mix(b, K, .5))); g.addColorStop(.42, rgb(b)); g.addColorStop(.8, rgb(mix(b, W, .2)));
      g.addColorStop(.93, rgb(b)); g.addColorStop(1, rgb(mix(b, K, .32)));

      x.lineWidth = R * .008; x.strokeStyle = "rgba(0,0,0,.25)"; x.beginPath(); x.arc(0, 0, R * .985, a0, a1); x.stroke();

  // Sprites pre-dibujados (focos y puntero) para no recalcular degradados y sombras en cada cuadro

  // ---------- Estado de giro ----------
  let rot = 0, prevRot = 0, spinAnim = null, mode = "idle", winIdx = -1, winFade = 0, winTarget = 0, pKick = 0;
  let pending = null, lastTickT = 0;

  // ---------- Focos ----------
  let bulbLvl = new Array(NB).fill(1), bPhase = 0, bLast = 0;
  function updateBulbs(now) {
    const iv = mode === "spin" ? 70 : (mode === "win" || mode === "landed") ? 140 : 200;
    if (now - bLast < iv) return;
    bLast = now; bPhase++;
    for (let i = 0; i < NB; i++) {
      let on;
      if (reduce) on = true;
      else if (mode === "spin") on = (i + bPhase) % 2 === 0;
      else if (mode === "win" || mode === "landed") on = bPhase % 2 === 0;
      else on = ((i - bPhase) % NB + NB) % NB < 6 || i % 2 === 0;

    }
  }

  const sparkScale = () => Math.max(.3, Math.min(1, Ro / 270));
  function emitSoft(k) {
    if (reduce) return;
    const ks = sparkScale(); k *= ks * ks;
    for (let j = 0; j < k * SPARK_RATE[Q] && sparks.length < SPARK_MAX[Q]; j++) {
      const a = Math.random() * TAU, r = Ro * (.98 + Math.random() * .05), dir = a + (Math.random() - .5) * 2.4;
      const sp = Ro * (.00015 + Math.random() * .0005);
      sparks.push({ soft: true, x: cx + Math.cos(a) * r, y: cx + Math.sin(a) * r, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, life: 0, max: 380 + Math.random() * 520, w: (.7 + Math.random() * 1.6) * (.55 + .45 * ks) });
    }
  }
  function emit(k, boost = 1) {
    if (reduce) return;
    const ks = sparkScale(); k *= ks;
    for (let j = 0; j < k * SPARK_RATE[Q] && sparks.length < SPARK_MAX[Q]; j++) {
      const a = Math.random() * TAU, r = Ro * (.97 + Math.random() * .06), dir = a + (Math.random() - .5) * .7;
      const sp = Ro * (.0005 + Math.random() * .0016) * boost;
      sparks.push({ x: cx + Math.cos(a) * r, y: cx + Math.sin(a) * r, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, life: 0, max: 220 + Math.random() * 520, w: (.6 + Math.random() * 1.5) * (.6 + .4 * ks), j: Math.random() < .25 });
    }
  }
  function drawSparks(x, dt, soft) {
    x.globalCompositeOperation = "lighter"; x.lineCap = "round";
    for (let i = sparks.length - 1; i >= 0; i--) {

      if (!!p.soft !== soft) continue;
      p.life += dt; if (p.life > p.max) { sparks.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy *= .985;
      const t = p.life / p.max, a = (1 - t) * (t < .1 ? t * 10 : 1);

        x.globalCompositeOperation = "source-over";

  // ---------- Dibujo de la ruleta ----------
  function drawWheel(now, dt) {

    for (let i = 0; i < NB; i++) {

      const a = -Math.PI / 2 + i * TAU / NB;
      x.drawImage(bulbSpr.halo, cx + Math.cos(a) * Rb - hs, cx + Math.sin(a) * Rb - hs, hs * 2, hs * 2);

    x.globalCompositeOperation = "source-over";
    for (let i = 0; i < NB; i++) {
      const a = -Math.PI / 2 + i * TAU / NB;
      x.drawImage(bulbLvl[i] > .5 ? bulbSpr.on : bulbSpr.off, cx + Math.cos(a) * Rb - bs, cx + Math.sin(a) * Rb - bs, bs * 2, bs * 2);

    x.save(); x.translate(cx, cx);
    for (let k = 0; k < n; k++) {
      x.globalAlpha = 1 / (k + 1);

      x.globalCompositeOperation = "source-over";

  // Destellos que recorren las líneas divisorias, uno tras otro alrededor de la ruleta
  function drawSeparatorLights(x, now) {
    if (reduce) return;
    const speed = Math.abs(rot - prevRot), vis = Math.max(0, 1 - speed * 14);
    if (vis <= .02) return;
    const n = state.segs.length, ARC = TAU / n, r0 = Rh * 1.05, r1 = Rd * .985, len = r1 - r0;
    const cyc = mode === "win" || mode === "landed" ? 900 : 2600;
    x.save(); x.rotate(rot); x.globalCompositeOperation = "lighter"; x.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * ARC - ARC / 2, ca = Math.cos(a), sa = Math.sin(a);
      // brillo base suave en todas las líneas
      x.strokeStyle = `rgba(255,240,248,${.1 * vis})`; x.lineWidth = Rd * .014;
      x.beginPath(); x.moveTo(ca * r0, sa * r0); x.lineTo(ca * r1, sa * r1); x.stroke();

      const t = (((now / cyc) - i / n) % 1 + 1) % 1;

    giftFx.hidden = false;
    playGift();
    giftTimers.push(setTimeout(() => tone(330, .25, .08, "triangle", 0, 520), reduce ? 0 : 2000));
    giftTimers.push(setTimeout(() => { sFanfare(); burst(); }, reduce ? 0 : 2720));
  }
  function hideGift() { giftTimers.forEach(clearTimeout); giftTimers = []; clearTimeout(confettiTimer); clearTimeout(starsTimer); gsScene.classList.remove("gs-play"); gsConfetti.innerHTML = ""; giftFx.hidden = true; }

  // ---------- Monedas y confeti ----------
  const fxc = $("fx"), fxx = fxc.getContext("2d");
  let fx = [], fxDirty = false;
  function layoutFx() { fxc.width = Math.round(innerWidth * dpr); fxc.height = Math.round(innerHeight * dpr); }
  // Confeti con caída suave: un estallido ligero desde el centro y una lluvia desde arriba
  let fxOut = 1;
  function clearConfetti() { fxOut = .999; }
  function burst() {
    if (reduce) return;
    fxOut = 1;
    const Wd = innerWidth, Hd = innerHeight, cols = ["#FC0680", "#FFB800", "#00B8E6", "#3CC43C", "#8A5BFF", "#FF7A1A", "#FF4D6D"];
    const piece = (x, y, vx, vy) => ({ x, y, vx, vy, c: cols[Math.floor(Math.random() * cols.length)],
      w: 7 + Math.random() * 7, h: 4 + Math.random() * 4, rot: Math.random() * TAU, vr: (Math.random() - .5) * .06,
      flip: Math.random() * TAU, vf: .04 + Math.random() * .08, sway: Math.random() * TAU, vs: .015 + Math.random() * .025,
      amp: .4 + Math.random() * .9, term: 1.5 + Math.random() * 1.5, life: 0, round: Math.random() < .2 });
    for (let i = 0; i < 90; i++) {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, sp = 4 + Math.random() * 7;
      fx.push(piece(Wd / 2 + (Math.random() - .5) * 60, Hd * .45, Math.cos(a) * sp, Math.sin(a) * sp));
    }
    for (let i = 0; i < 110; i++) {
      const pc = piece(Math.random() * Wd, -20 - Math.random() * Hd * .6, 0, Math.random() * .5);
      fx.push(pc);
    }
  }
  function drawFx(dt) {
    if (!fx.length) { if (fxDirty) { fxx.setTransform(1, 0, 0, 1, 0, 0); fxx.clearRect(0, 0, fxc.width, fxc.height); fxDirty = false; } return; }
    fxDirty = true;
    const x = fxx, k = dt / 16.7, Hd = innerHeight;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, innerWidth, Hd);
    if (fxOut < 1) { fxOut -= dt / 280; if (fxOut <= 0) { fx = []; fxOut = 1; return; } }
    for (let i = fx.length - 1; i >= 0; i--) {
      const p = fx[i];
      p.life += dt;
      // gravedad baja + resistencia del aire: cae despacio y se mece de lado a lado
      p.vy += .09 * k; p.vy *= Math.pow(.975, k); if (p.vy > p.term) p.vy += (p.term - p.vy) * .08 * k;
      p.vx *= Math.pow(.96, k);
      p.sway += p.vs * k; p.flip += p.vf * k; p.rot += p.vr * k;
      p.x += (p.vx + Math.sin(p.sway) * p.amp) * k; p.y += p.vy * k;
      if (p.y > Hd + 30) { fx.splice(i, 1); continue; }
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot + Math.sin(p.sway) * .5);
      x.scale(1, Math.cos(p.flip));
      x.globalAlpha = Math.min(1, p.life / 200) * fxOut;
      x.fillStyle = p.c;
      if (p.round) { x.beginPath(); x.arc(0, 0, p.h * .8, 0, TAU); x.fill(); }
      else x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    }
  }

  // ---------- Bucle ----------
  let last = performance.now();
  let frameN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    frameN++;
    // en calidad media/ligera, en reposo se dibuja a la mitad de cuadros para ahorrar batería
    if (Q < 2 && mode === "idle" && fx.length === 0 && (frameN & 1)) return;
    const dt = Math.min(50, now - last); last = now;
    trackPerf(dt);
    stepSpin(now); updateBulbs(now);
    winFade += (winTarget - winFade) * Math.min(1, dt / 160);
    if (mode === "idle" && Math.random() < .9) emit(1);
    if (mode === "win" && Math.random() < .6) emit(3, 1.6);
    if (Q === 2 || !(frameN & 2) || mode === "idle") drawBg(now);
    drawWheel(now, dt); drawFx(dt);
  }

  // ---------- Textos y editor ----------
  function setHint() { spinBtn.textContent = (state.hub || "SPIN").toUpperCase(); }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function renderTexts() {
    $("tEyebrow").textContent = state.eyebrow; $("tTitle").textContent = state.title;
    hubBtn.setAttribute("aria-label", `${state.hub || "Spin"}: spin the wheel`);
    if (mode === "idle") setHint();
  }
  const editor = $("editor"), toggle = $("editToggle"), segList = $("segList");
  function openEditor(open) {
    editor.hidden = !open; toggle.setAttribute("aria-expanded", String(open));
    if (open) { fillEditor(); $("fEyebrow").focus(); } else toggle.focus();
  }
  toggle.addEventListener("click", () => openEditor(editor.hidden));
  $("editClose").addEventListener("click", () => openEditor(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !editor.hidden) openEditor(false); });

  const F = { eyebrow: "fEyebrow", title: "fTitle", hub: "fHub" };
  for (const k in F) $(F[k]).addEventListener("input", e => {
    state[k] = e.target.value; renderTexts(); if (k === "hub") buildFront(); save();
  });
  $("fPalette").addEventListener("change", e => { state.palette = e.target.value; buildDisc(); save(); });

  const TYPES = [["puntos", "Points"], ["cupon", "Coupon ($)"], ["producto", "Free gift"], ["nada", "No prize"]];
  const DEFVAL = { puntos: "50", cupon: "$5", producto: "FREE GIFT", nada: "TRY AGAIN" };
  function odds() {
    const tot = state.segs.reduce((a, s) => a + Math.max(0, Number(s.weight) || 0), 0);
    segList.querySelectorAll("[data-odds]").forEach(el => {
      const w = Math.max(0, Number(state.segs[+el.dataset.odds].weight) || 0);
      el.textContent = tot ? `Comes up ${(w / tot * 100).toFixed(w / tot < .1 ? 1 : 0)}% of the time` : "—";
    });
  }
  function fillEditor() {
    for (const k in F) $(F[k]).value = state[k];
    $("fPalette").value = state.palette;
    const N = state.segs.length;
    segList.innerHTML = state.segs.map((s, i) => `
      <div class="seg-row">
        <div class="num">${i + 1}</div>
        <label>Type <select id="sType${i}" data-i="${i}" data-k="type">${TYPES.map(([v, l]) => `<option value="${v}"${v === s.type ? " selected" : ""}>${l}</option>`).join("")}</select></label>
        <label>${s.type === "puntos" ? "Points" : s.type === "cupon" ? "Amount" : "Text"} <input id="sVal${i}" data-i="${i}" data-k="value" type="text" value="${esc(s.value)}" maxlength="10"></label>
        <label>Weight <input id="sW${i}" data-i="${i}" data-k="weight" type="number" min="0" step="1" value="${esc(s.weight)}"></label>
        <div class="actions"><span class="odds" data-odds="${i}"></span>
          <span class="row"><button class="btn small" data-move="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Move prize ${i + 1} up">↑</button><button class="btn small" data-move="${i}" data-dir="1" ${i === N - 1 ? "disabled" : ""} aria-label="Move prize ${i + 1} down">↓</button></span></div>
      </div>`).join("");
    odds();
  }
  function segsChanged() { winIdx = -1; winTarget = 0; buildDisc(); save(); }
  segList.addEventListener("input", e => {
    const el = e.target, i = +el.dataset.i, k = el.dataset.k; if (!k || mode === "spin") return;
    state.segs[i][k] = el.value;
    if (k === "type") { state.segs[i].value = DEFVAL[el.value]; fillEditor(); $("sType" + i).focus(); }
    odds(); segsChanged();
  });
  segList.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || mode === "spin") return;
    if (b.dataset.move != null) { const i = +b.dataset.move, j = i + +b.dataset.dir; [state.segs[i], state.segs[j]] = [state.segs[j], state.segs[i]]; }
    fillEditor(); segsChanged();
  });
  let resetArmed = false;
  $("resetAll").addEventListener("click", e => {
    if (!resetArmed) { resetArmed = true; e.target.textContent = "Tap again to confirm"; setTimeout(() => { resetArmed = false; e.target.textContent = "Reset to original design"; }, 3000); return; }
    if (mode === "spin") return;
    resetArmed = false; e.target.textContent = "Reset to original design";
    state = clone(DEFAULT); save(); fillEditor(); renderTexts(); segsChanged(); buildFront();
  });

  // ---------- Sonido on/off ----------
  $("muteBtn").addEventListener("click", () => {
    muted = !muted;
    $("muteBtn").setAttribute("aria-pressed", String(muted));
    $("muteBtn").setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
    $("icoSound").hidden = muted; $("icoMute").hidden = !muted;
  });

  // Rayos giratorios pre-dibujados: evita el filtro blur de CSS, que en celular se recalcula en cada cuadro
  function bakeRays(el, rgb, peak, m) {
    try {
      const S = 720, c = mk(S, S), x = c.getContext("2d");
      if (!x.createConicGradient) return;
      const g = x.createConicGradient(0, S / 2, S / 2);
      for (let i = 0; i < 20; i++) { const o = i / 20; g.addColorStop(o, `rgba(${rgb},0)`); g.addColorStop(o + .025, `rgba(${rgb},${peak})`); g.addColorStop(o + .045, `rgba(${rgb},0)`); }
      g.addColorStop(1, `rgba(${rgb},0)`);
      x.fillStyle = g; x.fillRect(0, 0, S, S);
      const R = S / 2 * Math.SQRT2, mg = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, R);
      m.forEach(([o, a]) => mg.addColorStop(o, `rgba(0,0,0,${a})`));
      x.globalCompositeOperation = "destination-in"; x.fillStyle = mg; x.fillRect(0, 0, S, S);
      el.style.background = `url(${c.toDataURL()}) center / 100% 100% no-repeat`;
      el.style.filter = "none"; el.style.webkitMask = "none"; el.style.mask = "none";
    } catch (e) {}
  }
  bakeRays(document.querySelector(".wheel-rays"), "252,6,128", 0.06, [[0, 1], [.18, 1], [.32, .45], [.5, 0], [1, 0]]);
  bakeRays(document.querySelector(".win > .rays"), "252,6,128", 0.07, [[0, 1], [.18, .5], [.38, 0], [1, 0]]);

  // ---------- Inicio ----------
  function layoutAll() { dpr = Math.min(window.devicePixelRatio || 1, maxDpr()); layoutBg(); layoutWheel(); layoutFx(); }
  renderTexts(); layoutAll();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layoutAll, 120); });
  if (document.fonts) {
    Promise.all([document.fonts.load(`40px "Lilita One"`), document.fonts.load(`800 20px Montserrat`)]).catch(() => {}).then(() => { layoutWheel(); });
  }
  requestAnimationFrame(frame);
})();
</script>

(() => {

  new ResizeObserver(fit).observe(card);
  addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.getElementById('win'), { attributes: true, attributeFilter: ['hidden'] });
  if (document.fonts) document.fonts.ready.then(fit);

})();
