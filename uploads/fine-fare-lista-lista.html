<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose what to do next — Sweepstouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap">

<!--
  Copia estática de la pantalla "Choose what to do next" del linktree.

  Origen en el proyecto linktree-sweepstouch:
    app/prercs/[customerId]/ReceiptActions.tsx  → menú principal (phase "idle")

  Réplica 1:1 de ese componente: mismos tokens, mismas medidas, mismo grid y
  los dos idiomas que ya tiene. No se agregó ni se cambió nada del diseño.

  Lo único tomado de la captura y no del componente es el botón flotante de la
  lista (círculo con el portapapeles y el globo "+0"): ese no vive en
  ReceiptActions, sino en el shell de la página que lo envuelve.
-->

<style>
  /* ── Tokens del prercs (ReceiptActions.tsx) ── */
  :root {
    --brand: #FC0680;
    --ink: #080D18;
    --ink-2: #52525B;
    --hair: #E4E4E7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    font-family: "Poppins", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Contenedor: el grid de .receipt-actions ── */
  .receipt-actions {
    box-sizing: border-box;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 30px auto minmax(0, 1fr) auto auto auto auto auto;
    gap: clamp(3px, .7dvh, 7px);
    padding: calc(3px + env(safe-area-inset-top, 0px)) 10px calc(5px + env(safe-area-inset-bottom, 0px));
    color: #737373;
  }
  .receipt-actions > * { min-width: 0; }

  /* Cerrar */
  .close-row { display: flex; justify-content: flex-end; }
  .close-row button {
    width: 30px; height: 30px; display: grid; place-items: center;
    border: 1.5px solid var(--hair); border-radius: 50%; background: #fff; color: var(--ink-2); cursor: pointer;
  }

  /* Encabezado */
  .receipt-actions header { display: flex; align-items: flex-start; gap: 10px; }
  .receipt-actions header > span {
    border-radius: 50%; width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center;
    background: var(--brand); color: #fff; font-size: 24px;
  }
  .receipt-actions h1 {
    color: var(--brand); font-size: clamp(22px, 6.4vw, 29px); font-weight: 900; line-height: 1;
    letter-spacing: -.03em; margin: 0;
  }
  .receipt-actions h1 span { display: block; color: var(--brand); }
  .receipt-actions h1 .t1 { color: var(--ink); }
  .receipt-actions header p { font-size: 12px; line-height: 1.3; margin: 6px 0 0; color: var(--ink-2); }

  /* Ilustración */
  .receipt-art {
    height: 100%; min-height: 0; max-height: 250px; width: 100%; max-width: 290px;
    justify-self: center; display: flex; justify-content: center; align-items: center;
  }
  .receipt-art img { display: block; width: 100%; height: 100%; object-fit: contain; }

  /* Número de lista */
  .receipt-code {
    padding: 0; border: 0; background: transparent; color: #737373; font: inherit; cursor: pointer;
    text-align: center; line-height: 1.05;
  }
  .receipt-code span { display: block; font-size: 8px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .receipt-code strong { display: block; font-size: 20px; font-weight: 900; letter-spacing: .04em; overflow-wrap: anywhere; }

  /* Valor + puntos */
  .receipt-summary {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    background: #FFF7FB; border: 1px solid #FBE0ED; border-radius: 14px; padding: 8px;
  }
  .receipt-summary > div { display: flex; gap: 7px; align-items: center; }
  .receipt-summary > div + div { border-left: 1px solid #FFA5D2; padding-left: 12px; }
  .receipt-summary > div > span.ico {
    width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center;
    background: #FFE4F1; border-radius: 50%; color: var(--brand); font-weight: 900; font-size: 28px;
  }
  .receipt-summary .lbl { font-size: 11px; }
  .receipt-summary strong { color: var(--brand); font-size: clamp(20px, 5.7vw, 25px); font-weight: 900; }

  /* Contacto */
  .receipt-actions section { display: grid; gap: 2px; }
  .receipt-actions section h2 {
    margin: 0; text-align: center; font-size: 26px; line-height: 1.05; font-weight: 900;
    letter-spacing: -.035em; color: #737373;
  }
  .receipt-actions section > div {
    padding: 8px; border: 1px solid #FBCFE5; border-radius: 16px; background: #FFF6FA; display: grid; gap: 6px;
  }
  .contact-head { display: flex; align-items: flex-start; gap: 12px; }
  .contact-head svg { color: var(--brand); flex-shrink: 0; }
  .receipt-actions section strong { color: var(--brand); font-size: 14px; font-weight: 800; line-height: 1.25; display: block; }
  .receipt-actions section p { margin: 2px 0 0; font-size: 11px; line-height: 1.4; color: var(--ink-2); }
  .receipt-actions section a {
    min-height: 36px; padding: 5px 12px; display: flex; justify-content: center; align-items: center; gap: 12px;
    border: 1.5px solid var(--brand); border-radius: 999px; background: #fff; color: var(--brand);
    text-decoration: none; font-size: 18px; font-weight: 900; overflow-wrap: anywhere;
  }

  /* Guardar mi lista */
  .row-btn {
    display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 10px 16px; border-radius: 22px;
    border: 1.5px solid var(--brand); background: #fff; color: var(--brand); font: inherit; font-size: 16px;
    cursor: pointer; text-align: left;
  }
  .row-btn > svg:first-child { font-size: 28px; flex-shrink: 0; }
  .row-btn span.mid { flex: 1; border-left: 1px solid var(--brand); padding: 6px 0 6px 18px; }
  .row-btn strong { display: block; font-size: 16px; font-weight: 900; color: #737373; }

  /* Modificar mi lista */
  .edit-btn {
    min-height: 44px; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--brand); color: #fff;
    font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 8px 20px #FC06801A;
  }

  /* Botón flotante de la lista (tomado de la captura, no de este componente) */
  .list-fab {
    position: fixed; right: max(14px, calc(50% - 230px + 14px)); bottom: 18px; width: 64px; height: 64px;
    border-radius: 50%; border: 0; background: #fff; color: var(--brand); cursor: pointer;
    box-shadow: 0 10px 28px rgba(252,6,128,.28); display: grid; place-items: center; z-index: 5;
  }
  .list-fab b {
    position: absolute; top: -6px; right: -6px; background: var(--brand); color: #fff; border-radius: 999px;
    padding: 4px 10px; font-size: 14px; font-weight: 800; line-height: 1;
  }

  /* Alto chico: el componente aprieta todo para que entre sin scroll */
  @media (max-height: 650px) {
    .receipt-actions { gap: 3px; grid-template-rows: 26px auto minmax(0, 1fr) auto auto auto auto auto; }
    .receipt-actions h1 { font-size: 22px; }
    .receipt-actions header p { font-size: 11px; }
    .receipt-summary { padding: 5px 8px; }
    .receipt-actions section h2 { font-size: 22px; }
    .receipt-actions section > div { padding: 6px; gap: 4px; }
    .row-btn, .edit-btn { padding: 6px 12px; }
  }
  /* Apaisado: dos columnas, igual que el componente */
  @media (orientation: landscape) and (max-height: 550px) {
    .receipt-actions {
      max-width: none; grid-template-columns: 1fr 1fr;
      grid-template-rows: 26px auto minmax(0, 1fr) auto auto; column-gap: 12px;
    }
    .close-row { grid-column: 1 / -1; }
    .receipt-actions header { grid-column: 1; grid-row: 2; }
    .receipt-art { grid-column: 1; grid-row: 3; }
    .receipt-code { grid-column: 1; grid-row: 4; }
    .receipt-summary { grid-column: 1; grid-row: 5; }
    .receipt-actions section { grid-column: 2; grid-row: 2 / 4; align-self: center; }
    .row-btn, .edit-btn { grid-column: 2; }
  }
</style>
</head>
<body>

<main class="receipt-actions">
  <div class="close-row">
    <button type="button" aria-label="Close">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
  </div>

  <header>
    <span>✓</span>
    <div>
      <h1><span class="t1" data-t="h1a">Choose what to</span><span data-t="h1b">do next.</span></h1>
      <p data-t="sub">Your list is ready. Choose an option below.</p>
    </div>
  </header>

  <div class="receipt-art" aria-hidden="true">
    <img src="https://www.swtrcs.com/list-call-illustration.png" alt="">
  </div>

  <button type="button" class="receipt-code" id="codeBtn" aria-label="Copy list number">
    <span id="codeLbl" data-t="codeLbl">Your list number</span>
    <strong id="code">SL-X8PECQ</strong>
  </button>

  <div class="receipt-summary">
    <div>
      <span class="ico">$</span>
      <div>
        <div class="lbl" data-t="value">List value</div>
        <strong>$9.18</strong>
      </div>
    </div>
    <div>
      <span class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
          <path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5" />
        </svg>
      </span>
      <div>
        <div class="lbl" data-t="points">Estimated points</div>
        <strong>+9 pts</strong>
      </div>
    </div>
  </div>

  <section aria-labelledby="contact-title">
    <h2 id="contact-title" data-t="contact">Contact us!</h2>
    <div>
      <div class="contact-head">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z" /><path d="M12 7v6M9 10h6" />
        </svg>
        <div>
          <strong data-t="availT">Check availability</strong>
          <p data-t="availB">Confirm availability before you go.</p>
        </div>
      </div>

      <a href="https://wa.me/12018894875" target="_blank" rel="noopener noreferrer" aria-label="Reserve my list via WhatsApp at (201) 889-4875">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23a8.2 8.2 0 0 1 8.23 8.24c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.16 0-.43.06-.65.31-.22.25-.85.84-.85 2.04s.87 2.37 1 2.53c.12.16 1.71 2.61 4.15 3.66.58.25 1.03.4 1.38.51.58.19 1.11.16 1.53.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/>
        </svg>
        (201) 889-4875
      </a>

      <a href="tel:+12016864638" aria-label="Call customer support at (201) 686-4638">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z" />
        </svg>
        <span data-t="support">Customer support</span>
      </a>
    </div>
  </section>

  <button type="button" class="row-btn">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2z" /><path d="M8 7h8M8 11h8M8 15h5" />
    </svg>
    <span class="mid"><strong data-t="save">Save my list</strong></span>
    <svg width="18" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
  </button>

  <button type="button" class="edit-btn">← <span data-t="edit">Edit my list</span></button>
</main>

<!-- Botón flotante de la lista: reproducido de la captura -->
<button type="button" class="list-fab" aria-label="My list">
  <b>+0</b>
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="2" width="8" height="4" rx="1" />
    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
    <path d="M9 12h6M9 16h4" />
  </svg>
</button>

<script>
/* Los dos idiomas del componente (`es ? … : …` en ReceiptActions.tsx).
   Se elige con ?lang=es en la URL, como hace el linktree. */
const COPY = {
  en: {
    h1a: "Choose what to", h1b: "do next.",
    sub: "Your list is ready. Choose an option below.",
    codeLbl: "Your list number", copied: "Copied",
    value: "List value", points: "Estimated points",
    contact: "Contact us!", availT: "Check availability", availB: "Confirm availability before you go.",
    support: "Customer support", save: "Save my list", edit: "Edit my list",
  },
  es: {
    h1a: "Elige qué quieres", h1b: "hacer ahora.",
    sub: "Tu lista está preparada. Elige una opción abajo.",
    codeLbl: "Tu número de lista", copied: "Copiado",
    value: "Valor de tu lista", points: "Puntos estimados",
    contact: "¡Contáctanos!", availT: "Consulta la disponibilidad", availB: "Confirma la disponibilidad antes de ir.",
    support: "Customer support", save: "Guardar mi lista", edit: "Modificar mi lista",
  },
};

const lang = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "en";
const t = COPY[lang];
document.documentElement.lang = lang;
document.querySelectorAll("[data-t]").forEach((el) => {
  if (t[el.dataset.t]) el.textContent = t[el.dataset.t];
});

/* Copiar el número de lista: la etiqueta cambia a "Copiado" por 1,8 s. */
document.getElementById("codeBtn").addEventListener("click", () => {
  const lbl = document.getElementById("codeLbl");
  const code = document.getElementById("code").textContent;
  navigator.clipboard?.writeText(code).catch(() => {});
  lbl.textContent = t.copied;
  setTimeout(() => { lbl.textContent = t.codeLbl; }, 1800);
});
</script>
</body>
</html>
