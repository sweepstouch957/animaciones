<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine Fare Supermarket — Sweepstouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">

<!--
  Copia estática de la portada del linktree para la tienda:
  /?slug=fine-fare-supermarket-379-horseblock-road-farmingville-ny-11738-usa

  Réplica de lo que hay hoy en el proyecto linktree-sweepstouch
  (StoreLandingClient + landing/* + public/prize-wheel.html). No se agregó ni se
  cambió nada del diseño: los datos de la tienda son los reales de la API y la
  ruleta es el mismo archivo de producción, embebido acá adentro.

  Lo único que NO hace, porque vive en modales aparte del proyecto: las cuatro
  tarjetas (VIP Deals, Circular, Puntos, Sorteos) y el CTA de la lista no abren
  nada; son visuales.
-->

<style>
  :root {
    --pink: #E6007E;
    --w: 430px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    font-family: var(--font-poppins, "Poppins"), system-ui, sans-serif;
    color: #1a0f2e;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: var(--w); margin: 0 auto; position: relative; min-height: 100%; }

  /* ── Animaciones del landing (app/globals.css del proyecto) ── */
  @keyframes ffFadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes ffFloatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes ffGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,0,126,.55), 0 18px 40px rgba(230,0,126,.35); }
    50% { box-shadow: 0 0 0 8px rgba(230,0,126,0), 0 18px 48px rgba(230,0,126,.5); }
  }
  @keyframes ffShimmer { 0% { transform: translateX(-120%) skewX(-20deg); } 100% { transform: translateX(320%) skewX(-20deg); } }
  @keyframes ffPop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes ffPhoneGlow { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
  @keyframes ffConfetti {
    0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.5); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); }
  }
  @keyframes ffBurst { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
  @keyframes ffPtsUp {
    0% { opacity: 0; transform: translateY(4px) scale(.7); }
    25% { opacity: 1; transform: translateY(-2px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-14px) scale(1); }
  }
  @keyframes ffTapPulse { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes ffSparkle {
    0% { opacity: 0; transform: rotate(var(--r)) translateY(0) scale(.4); }
    40% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--r)) translateY(-16px) scale(1); }
  }
  @keyframes ffToastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ── Header ── */
  .hdr { display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px; animation: ffFadeUp .5s ease both; }
  .hdr-logo {
    background: #fff; border: 1.5px solid #ece7ef; border-radius: 14px; padding: 6px;
    display: grid; place-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.10); flex-shrink: 0;
  }
  .hdr-logo img { height: 38px; width: 72px; object-fit: contain; }
  .hdr-name { font-weight: 700; font-size: 15px; color: #1a0f2e; line-height: 1.15; }
  .hdr-tag { font-size: 11.5px; color: #6b6479; overflow-wrap: anywhere; }
  .lang { display: flex; background: #fff; border: 1.5px solid #e9e4ee; border-radius: 999px; padding: 3px; flex-shrink: 0; }
  .lang button {
    border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; background: transparent; color: #6b6479;
  }
  .lang button[aria-pressed="true"] { background: var(--pink); color: #fff; }

  .stack { display: flex; flex-direction: column; gap: 7px; padding: 6px 12px 0; }

  /* ── Hero "Make your list" ── */
  .hero {
    position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 5 / 6; min-height: 352px;
    background: #0d0a12; cursor: pointer; border: 2px solid var(--pink);
    animation: ffFadeUp .6s .1s ease both, ffGlow 2.6s 1s ease-in-out infinite;
    transform: translateZ(0); padding: 0; width: 100%; text-align: left; font: inherit; display: block;
  }
  .hero-bg   { position: absolute; inset: 0; background: linear-gradient(140deg,#1b0a16 0%,#3a0a2a 45%,#0d0a12 100%); }
  .hero-veil { position: absolute; inset: 0; background: linear-gradient(90deg,rgba(10,6,14,.96) 0%,rgba(10,6,14,.82) 42%,rgba(10,6,14,.25) 100%); pointer-events: none; }
  .hero-halo { position: absolute; inset: 0; background: radial-gradient(circle at 85% 15%,rgba(230,0,126,.35),transparent 45%); pointer-events: none; }
  .hero-shine {
    position: absolute; top: 0; left: 0; width: 40%; height: 100%; pointer-events: none;
    background: linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    animation: ffShimmer 4s 1.5s ease-in-out infinite;
  }
  .hero-badge {
    position: absolute; top: 38px; left: 16px; background: #EDEAF0; color: var(--pink);
    font-weight: 800; font-size: 13px; letter-spacing: 1.2px; padding: 8px 13px; border-radius: 999px;
    text-transform: uppercase; pointer-events: none; animation: ffPop .5s .8s ease both;
  }
  .hero-copy {
    position: absolute; top: calc(50% + 40px); left: 0; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-start; padding: 0 18px; width: 60%; pointer-events: none;
  }
  .hero-kicker { color: #FF3D9C; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; margin-top: 8px; }
  .hero-t1 { color: #fff; font-weight: 800; font-size: 34px; line-height: 1; margin-top: 2px; }
  .hero-t2 { color: var(--pink); font-weight: 800; font-size: 34px; line-height: 1; }
  .hero-body { color: #f0eaf2; font-size: 13px; margin-top: 10px; line-height: 1.4; }
  .hero-cta {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; background: var(--pink); color: #fff;
    font-weight: 700; font-size: 14px; padding: 13px 22px; border-radius: 999px; box-shadow: 0 8px 20px rgba(230,0,126,.45);
  }
  .hero-script {
    position: absolute; right: 12px; top: 38px; font-family: "Caveat", cursive; font-weight: 700; color: #fff;
    font-size: 22px; line-height: 1.05; text-align: center; transform: rotate(-6deg); white-space: nowrap;
    pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .hero-script i { display: block; height: 3px; width: 70%; background: var(--pink); border-radius: 2px; margin: 4px auto 0; }

  /* ── Teléfono del hero ── */
  .phone {
    position: absolute; right: 12px; top: calc(50% - 119px); width: 152px; height: 290px; background: #111;
    border-radius: 22px; border: 5px solid #2a2530; box-shadow: 0 22px 50px rgba(0,0,0,.6);
    animation: ffFloatY 4s ease-in-out infinite; overflow: hidden; pointer-events: none;
  }
  .phone-fx { position: absolute; right: 12px; top: calc(50% - 119px); width: 152px; height: 290px; pointer-events: none; }
  .phone-inner { background: #f7f5f8; height: 100%; padding: 12px 7px 0; display: flex; flex-direction: column; position: relative; }
  .phone-notch { height: 4px; width: 30px; background: #111; border-radius: 4px; margin: -6px auto 7px; flex-shrink: 0; }
  .phone-head { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .phone-title { font-weight: 800; font-size: 10px; color: #111; }
  .phone-sel { font-size: 6.5px; font-weight: 700; color: var(--pink); margin-top: 2px; flex-shrink: 0; }
  .phone-list { flex: 1; overflow: hidden; margin-top: 6px; padding-bottom: 28px; }
  .phone-rows { display: flex; flex-direction: column; gap: 5px; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .row { background: #fff; border-radius: 7px; border: 1px solid #ece7ef; overflow: hidden; transition: border-color .3s; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .row.on { border-color: var(--pink); }
  .row-top { display: flex; align-items: center; gap: 5px; padding: 5px 6px; }
  .row-name { font-weight: 800; font-size: 7.5px; color: #111; line-height: 1.1; }
  .row-sub { font-size: 4.5px; color: #6b6479; margin-top: 1px; }
  .row-prices { display: flex; align-items: baseline; gap: 3px; margin-top: 2px; }
  .row-price { font-weight: 800; font-size: 9px; color: #111; }
  .row-unit { font-size: 5px; color: #111; }
  .row-old { font-size: 6px; color: #9a95a0; text-decoration: line-through; }
  .check { position: relative; width: 15px; height: 15px; flex-shrink: 0; }
  .check-dot {
    position: relative; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; background: #fff; border: 1.5px solid #ddd8e0; transition: all .3s;
  }
  .row.on .check-dot { background: var(--pink); border-color: var(--pink); }
  .row-foot { display: none; align-items: center; justify-content: space-between; background: #f7f5f8; border-top: 1px solid #eee9f0; padding: 3px 6px; }
  .row.on .row-foot { display: flex; }
  .row-save { font-weight: 800; font-size: 7px; color: var(--pink); }
  .row-qty { display: flex; align-items: center; gap: 3px; font-size: 5px; color: #444; }
  .row-qty span.b { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #ccc; display: inline-flex; align-items: center; justify-content: center; font-size: 6px; line-height: 1; }
  .row-qty span.bp { border-color: #111; }
  .phone-foot {
    position: absolute; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -4px 12px rgba(0,0,0,.08);
    padding: 5px 7px 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .phone-foot-lbl { font-size: 5px; color: #111; font-weight: 600; }
  .phone-foot-total { font-weight: 800; font-size: 11px; color: var(--pink); line-height: 1.1; transition: all .3s; }
  .phone-pts { border: 1px solid var(--pink); border-radius: 999px; padding: 3px 6px; font-size: 5.5px; font-weight: 800; color: #111; display: flex; align-items: center; gap: 2px; }

  /* ── Tarjetas 2×2 ── */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .tile {
    position: relative; border-radius: 9px; overflow: hidden; aspect-ratio: 1.4 / 1; height: 100%;
    background: #0b0d0f; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); transform: translateZ(0);
    display: block; width: 100%; border: 0; padding: 0; text-align: left; font: inherit;
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: right center; }
  .tile-veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.5) 32%,transparent 65%); }
  .tile-txt {
    position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px 10px; pointer-events: none; color: #fff;
    font-weight: 800; font-size: clamp(16px, 4.8vw, 20px); line-height: 1.05; letter-spacing: -.5px; text-shadow: 0 1px 5px rgba(0,0,0,.6);
  }
  .tile-txt b { display: block; font-weight: 800; }
  .tile-txt span { display: block; font-weight: 400; }
  .tile-go {
    position: absolute; right: 7px; top: 7px; display: grid; place-items: center; width: 25px; height: 25px;
    border-radius: 50%; background: #fff; color: var(--pink); pointer-events: none;
  }

  /* ── Stay Updated ── */
  .news {
    border-radius: 22px; background: #fff; border: 1.5px solid #f3d3e4; padding: 20px 18px;
    box-shadow: 0 10px 30px rgba(230,0,126,.08); animation: ffFadeUp .6s .7s ease both;
  }
  .news-head { display: flex; gap: 14px; align-items: flex-start; }
  .news-t { font-weight: 800; font-size: 24px; line-height: 1.1; color: #111; }
  .news-t em { color: var(--pink); font-style: normal; }
  .news-b { font-size: 12px; color: #6b6479; margin-top: 4px; line-height: 1.4; }
  .news-form { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .news-form input {
    width: 100%; border: 1.5px solid #e6e0ea; border-radius: 12px; padding: 12px 14px;
    font: 500 14px "Poppins", sans-serif; outline: none; color: #111; background: #fff;
  }
  .news-hint { font-size: 11px; color: #8a8395; text-align: right; margin-top: -4px; }
  .news-cta {
    border: 0; background: var(--pink); color: #fff; font: 700 15px "Poppins", sans-serif; padding: 14px;
    border-radius: 999px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
    box-shadow: 0 8px 20px rgba(230,0,126,.35);
  }
  .news-done { margin-top: 16px; background: #fff0f7; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; animation: ffPop .45s ease both; }
  .news-done i { width: 36px; height: 36px; border-radius: 50%; background: var(--pink); display: grid; place-items: center; flex-shrink: 0; }
  .news-done p { margin: 0; font-weight: 600; font-size: 13px; color: #111; line-height: 1.4; }

  /* ── Footer + FAB ── */
  .foot { display: flex; align-items: center; gap: 12px; padding: 14px 10px 0; animation: ffFadeUp .6s .8s ease both; }
  .foot i { flex: 1; height: 1px; background: #e2dde6; }
  .foot span { font-size: 10px; letter-spacing: 3px; color: #6b6479; font-weight: 500; white-space: nowrap; }
  .foot-rule { height: 3px; width: 60px; background: var(--pink); border-radius: 2px; margin: -4px auto 0; }
  .fab {
    position: fixed; right: max(16px, calc(50% - 215px + 16px)); bottom: 18px; width: 42px; height: 42px;
    border-radius: 50%; border: 0; background: var(--pink); color: #fff; cursor: pointer;
    box-shadow: 0 10px 26px rgba(230,0,126,.45); display: grid; place-items: center;
    animation: ffPop .5s 1s ease both; z-index: 5;
  }
  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: #111; color: #fff;
    font-weight: 600; font-size: 13px; padding: 12px 18px; border-radius: 999px; z-index: 30;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: ffToastIn .3s ease both; white-space: nowrap;
  }

  /* ── Ruleta (mismo comportamiento que DelayedPrizeWheel) ── */
  .wheel-shade { position: fixed; inset: 0; z-index: 2000; background: #000a; animation: ffFadeIn .7s ease both; }
  @keyframes ffFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .wheel-modal {
    position: fixed; inset: 0; margin: auto; width: min(480px, calc(100vw - 12px)); height: min(850px, calc(100dvh - 16px));
    max-width: none; max-height: none; padding: 0; border: 0; border-radius: 0; background: transparent;
    overflow: hidden; box-shadow: none; animation: wheelEnter .3s ease both; z-index: 2001;
  }
  @keyframes wheelEnter { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  .wheel-modal::backdrop { background: transparent; }
  .wheel-modal iframe { width: 100%; height: 100%; border: 0; display: block; }
  .wheel-close {
    position: absolute; top: 10px; left: 10px; z-index: 1; width: 40px; height: 40px; border: 1px solid #ddd;
    border-radius: 50%; background: #fff; color: #333; font-size: 28px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <!-- ══════════ Header ══════════ -->
  <div class="hdr">
    <div class="hdr-logo">
      <img src="https://res.cloudinary.com/dygofmmym/image/upload/v1744212026/fine_fare_pnpkjc.webp" alt="Fine Fare Supermarket">
    </div>
    <div style="flex:1;min-width:0">
      <div class="hdr-name" id="storeName">Fine Fare Supermarket</div>
      <div class="hdr-tag" data-t="tagline">Good food. Greater savings.</div>
    </div>
    <div class="lang">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>

  <div class="stack">
    <!-- ══════════ Hero: haz tu lista ══════════ -->
    <button type="button" class="hero">
      <span class="hero-bg"></span>
      <span class="hero-veil"></span>
      <span class="hero-halo"></span>
      <span class="hero-shine"></span>

      <span class="hero-badge" data-t="list.badge">Start here</span>

      <span class="hero-copy">
        <span>
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#E6007E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" />
          </svg>
          <span class="hero-kicker" data-t="list.kicker">SHOP SMARTER</span>
          <span class="hero-t1" data-t="list.t1">MAKE</span>
          <span class="hero-t2" data-t="list.t2">YOUR LIST</span>
          <span class="hero-body" data-t="list.body">Plan your shopping and save more.</span>
        </span>
        <span class="hero-cta"><span data-t="list.cta">Start My List</span> <span>→</span></span>
      </span>

      <!-- efectos del toque, por encima del teléfono -->
      <span class="phone-fx" id="phoneFx"></span>

      <!-- teléfono -->
      <span class="phone">
        <span class="phone-inner">
          <span class="phone-notch"></span>
          <span class="phone-head">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#E6007E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="4" rx="1" />
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
              <path d="m9 14 2 2 4-4" />
            </svg>
            <span class="phone-title" data-t="list.previewTitle">Your list</span>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#E6007E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </span>
          <span class="phone-sel" id="phoneSel">0 selected</span>

          <span class="phone-list">
            <span class="phone-rows" id="phoneRows"></span>
          </span>

          <span class="phone-foot">
            <span>
              <span class="phone-foot-lbl" data-t="list.previewSavings">Your estimated savings</span>
              <span class="phone-foot-total" id="phoneTotal">$0.00</span>
            </span>
            <span class="phone-pts" id="phonePts">0 <span style="font-weight:600">pts</span> <span style="color:#E6007E">›</span></span>
          </span>
        </span>
      </span>

      <span class="hero-script"><span data-t="list.script">A Smarter Way to Shop</span><i></i></span>
    </button>

    <!-- ══════════ Cuatro tarjetas ══════════ -->
    <div class="tiles">
      <button type="button" class="tile" style="animation: ffFadeUp .6s .25s ease both">
        <img src="https://www.swtrcs.com/linktree/tile-1.png" alt="" aria-hidden="true">
        <span class="tile-veil"></span>
        <span class="tile-txt"><b data-t="deals.t1">VIP</b><span data-t="deals.t2">DEALS</span></span>
        <span class="tile-go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        </span>
      </button>

      <button type="button" class="tile" style="animation: ffFadeUp .6s .37s ease both">
        <img src="https://www.swtrcs.com/linktree/tile-2.png" alt="" aria-hidden="true">
        <span class="tile-veil"></span>
        <span class="tile-txt"><b data-t="circular.t1">WEEKLY</b><span data-t="circular.t2">CIRCULAR</span></span>
        <span class="tile-go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        </span>
      </button>

      <button type="button" class="tile" style="animation: ffFadeUp .6s .49s ease both">
        <img src="https://www.swtrcs.com/linktree/tile-3.png" alt="" aria-hidden="true">
        <span class="tile-veil"></span>
        <span class="tile-txt"><b data-t="rewards.t1">POINTS &amp;</b><span data-t="rewards.t2">REWARDS</span></span>
        <span class="tile-go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7" /></svg>
        </span>
      </button>

      <button type="button" class="tile" style="animation: ffFadeUp .6s .61s ease both">
        <img src="https://www.swtrcs.com/linktree/tile-4.png" alt="" aria-hidden="true">
        <span class="tile-veil"></span>

<script>
/* ══════════════════ Textos EN / ES (components/landing/copy.ts) ══════════════════ */
const COPY = {
  en: {
    tagline: "Good food. Greater savings.",
    list: { badge: "Start here", kicker: "SHOP SMARTER", t1: "MAKE", t2: "YOUR LIST",
      body: "Plan your shopping and save more.", cta: "Start My List", script: "A Smarter Way to Shop",

  es: {

    list: { badge: "Empieza aquí", kicker: "COMPRA INTELIGENTE", t1: "HAZ", t2: "TU LISTA",
      body: "Planifica tu compra y ahorra más.", cta: "Crear mi lista", script: "Una forma más inteligente",
      previewTitle: "Tu lista", previewSub: "Precio de oferta y ahorro por unidad.", previewQty: "Cantidad",
      previewSave: "Ahorra", previewSavings: "Tu ahorro estimado", previewSelected: "seleccionados" },
    deals: { t1: "OFERTAS", t2: "VIP" },
    circular: { t1: "CIRCULAR", t2: "SEMANAL" },
    rewards: { t1: "PUNTOS Y", t2: "PREMIOS" },
    sweeps: { t1: "SORTEOS", t2: "" },
    form: { t1: "Mantente", t2: "¡Al día!", body: "Sé el primero en enterarte de ofertas exclusivas, promociones y más.",
      name: "Nombre completo", phoneReq: "Teléfono de EE. UU. requerido", cta: "Registrarme",
      done: "¡Listo! Te enviaremos las mejores ofertas." },
    footer: "Powered by Sweepstouch",
    shared: "¡Link copiado!",
  },
};

let lang = "en";
const dig = (o, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), o);

function applyLang() {
  const t = COPY[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = dig(t, el.dataset.t);
    if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-tp]").forEach((el) => {
    const v = dig(t, el.dataset.tp);
    if (typeof v === "string") el.placeholder = v;
  });
  document.querySelectorAll(".lang button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  renderPhone();
}

document.querySelectorAll(".lang button").forEach((b) => {
  b.addEventListener("click", () => { lang = b.dataset.lang; applyLang(); });
});

/* ══════════════════ Teléfono animado (landing/ListPhoneMock.tsx) ══════════════════ */
const PV = [
  { name: "Beef Oxtail", price: 6.99, old: 8.74 },
  { name: "Regular Beef Trip", price: 2.69, old: 3.36 },
  { name: "Chicken Wings", price: 1.99, old: 2.49 },
  { name: "Whole Chicken", price: 1.59, old: 1.99 },
  { name: "Pork Chops", price: 3.49, old: 4.29 },
  { name: "Ground Beef", price: 4.99, old: 5.99 },
];
const SEQ = [0, 1, 3, 5];
const CONF = ["#E6007E", "#FFE500", "#FF3D9C", "#fff", "#E6007E", "#FFE500", "#FF3D9C", "#fff", "#E6007E", "#FFE500", "#FF3D9C", "#fff"];

let tick = 0;
const rowsEl = document.getElementById("phoneRows");
const fxEl = document.getElementById("phoneFx");

function renderPhone() {
  const t = COPY[lang].list;
  const step = tick % (SEQ.length + 2);
  const sel = SEQ.slice(0, Math.min(step, SEQ.length));
  const lastTap = step >= 1 && step <= SEQ.length ? SEQ[step - 1] : -1;

  const total = "$" + sel.reduce((a, i) => a + (PV[i].old - PV[i].price), 0).toFixed(2);
  const pts = String(sel.length * 125);

  rowsEl.style.transform = "translateY(" + (-Math.max(0, lastTap - 1) * 44) + "px)";
  rowsEl.innerHTML = PV.map((p, i) => {
    const on = sel.includes(i);
    const tapped = i === lastTap;
    return '<span class="row' + (on ? " on" : "") + '">' +
      '<span class="row-top">' +
        '<span style="flex:1;min-width:0">' +
          '<span class="row-name">' + p.name + '</span>' +
          '<span class="row-sub">' + t.previewSub + '</span>' +
          '<span class="row-prices"><span class="row-price">$' + p.price.toFixed(2) + '</span>' +
            '<span class="row-unit">/lb</span><span class="row-old">$' + p.old.toFixed(2) + '</span></span>' +
        '</span>' +
        '<span class="check">' + (tapped ? tapFx() : "") +
          '<span class="check-dot"' + (tapped ? ' style="animation:ffTapPulse .5s ease both"' : "") + '>' +
            '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="' + (on ? "#fff" : "#ddd8e0") + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></svg>' +
          '</span>' +
        '</span>' +
      '</span>' +
      '<span class="row-foot">' +
        '<span class="row-save">' + t.previewSave + " $" + (p.old - p.price).toFixed(2) + '</span>' +
        '<span class="row-qty">' + t.previewQty +
          '<span class="b">−</span><b style="font-size:6px;color:#111">1</b><span class="b bp">+</span>' +
        '</span>' +
      '</span>' +
    '</span>';
  }).join("");

  document.getElementById("phoneSel").textContent = sel.length + " " + t.previewSelected;
  document.getElementById("phoneTotal").textContent = total;
  document.getElementById("phonePts").innerHTML = pts + ' <span style="font-weight:600">pts</span> <span style="color:#E6007E">›</span>';

  // confetti + glow alrededor del teléfono al tocar un producto
  fxEl.innerHTML = lastTap < 0 ? "" :
    '<span style="position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,.6),rgba(230,0,126,0) 70%);animation:ffPhoneGlow 1s ease-out both"></span>' +
    CONF.map((c, i) => {
      const a = (i / CONF.length) * Math.PI * 2;
      const d = 90 + (i % 3) * 25;
      return '<span style="position:absolute;left:50%;top:45%;width:' + (i % 2 ? 6 : 4) + 'px;height:' + (i % 2 ? 3 : 4) +
        'px;border-radius:' + (i % 2 ? "1px" : "50%") + ';background:' + c +
        ';--dx:' + (Math.cos(a) * d).toFixed(1) + 'px;--dy:' + (Math.sin(a) * d - 20).toFixed(1) + 'px;--rot:' + (i * 137) +
        'deg;animation:ffConfetti ' + (0.9 + (i % 4) * 0.15) + 's ease-out both"></span>';
    }).join("");
}

function tapFx() {
  return '<span style="position:absolute;inset:0">' +
    '<span style="position:absolute;inset:0;border-radius:50%;border:1.5px solid #E6007E;animation:ffBurst .7s ease-out both"></span>' +
    '<span style="position:absolute;inset:0;border-radius:50%;background:rgba(230,0,126,.35);animation:ffBurst .9s .1s ease-out both"></span>' +
    [0, 72, 144, 216, 288].map((r) =>
      '<span style="position:absolute;left:6px;top:6px;width:3px;height:3px;border-radius:50%;background:' +
      (r % 144 === 0 ? "#FFE500" : "#E6007E") + ';--r:' + r + 'deg;animation:ffSparkle .8s .05s ease-out both"></span>'
    ).join("") +
    '<span style="position:absolute;right:-2px;top:-9px;font-size:7px;font-weight:800;color:#E6007E;white-space:nowrap;text-shadow:0 0 4px #fff;animation:ffPtsUp 1.1s ease-out both">+125 pts</span>' +
  '</span>';
}

setInterval(() => { tick++; renderPhone(); }, 1500);

/* ══════════════════ Formulario y compartir ══════════════════ */
const phoneDigits = (v) => {
  const d = (v || "").replace(/\D/g, "");
  return d.length === 11 && d[0] === "1" ? d.slice(1) : d.slice(0, 10);
};
document.getElementById("fPhone").addEventListener("input", (e) => {
  const d = phoneDigits(e.target.value);
  e.target.value = !d.length ? "" : d.length <= 3 ? "(" + d
    : d.length <= 6 ? "(" + d.slice(0, 3) + ") " + d.slice(3)
    : "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
});
document.getElementById("newsCta").addEventListener("click", () => {
  // Copia estática: no hay backend. Sólo muestra el estado "listo" del diseño.
  document.getElementById("newsForm").hidden = true;
  document.getElementById("newsDone").hidden = false;
});

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
document.getElementById("fab").addEventListener("click", async () => {
  const url = location.href;
  try {
    if (navigator.share) return navigator.share({ title: "Fine Fare Supermarket", url });
    await navigator.clipboard.writeText(url);
    toast(COPY[lang].shared);
  } catch { toast(COPY[lang].shared); }
});

setTimeout(() => {
  const shade = document.createElement("div");
  shade.className = "wheel-shade";
  document.body.appendChild(shade);

  setTimeout(() => {
    const dlg = document.createElement("dialog");
    dlg.className = "wheel-modal";
    dlg.setAttribute("aria-label", "Sweepstouch Prize Game");
    dlg.innerHTML =
      '<button type="button" class="wheel-close" aria-label="Cerrar / Close">×</button>' +
      '<iframe title="Sweepstouch Prize Game" sandbox="allow-scripts" src="data:text/html;base64,' + WHEEL_B64 + '"></iframe>';
    document.body.appendChild(dlg);
    document.body.style.overflow = "hidden";

    const close = () => {
      dlg.remove();
      shade.remove();
      document.body.style.overflow = "";
    };
    dlg.querySelector(".wheel-close").addEventListener("click", close);
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
    window.addEventListener("message", (e) => {
      if ((e.data || {}).type === "prize-wheel-close") close();
    });
    dlg.showModal();
  }, 1000);
}, 0);

applyLang();
</script>
